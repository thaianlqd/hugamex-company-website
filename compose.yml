services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hugamex
      POSTGRES_USER: hugamex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hugamex-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugamex -d hugamex"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  hugamex-local-data:
