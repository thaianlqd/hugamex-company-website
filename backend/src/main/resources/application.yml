spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${app.secure-cookies}
        same-site: lax
app:
  jwt-key: ${JWT_SIGNING_KEY}
  token-key: ${TOKEN_HASH_KEY}
  otp-key: ${OTP_HMAC_KEY}
  mfa-key: ${MFA_ENCRYPTION_KEY}
  origins: ${CORS_ALLOWED_ORIGINS}
  frontend-url: ${FRONTEND_URL}
  secure-cookies: true
  mail-from: ${MAIL_FROM:}
  mail-mode: ${MAIL_MODE:file}
  contact-notifications-enabled: ${CONTACT_NOTIFICATIONS_ENABLED:false}
  contact-notification-email: ${CONTACT_NOTIFICATION_EMAIL:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

debug: false
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
